<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>RPG 2D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     TRANG CHỦ
========================= -->
<div id="homeScreen">

    <div class="homeBox">

        <h1>⚔️ RPG 2D ⚔️</h1>

        <p class="subtitle">
            Phiêu lưu • Chiến đấu • Lên cấp
        </p>

        <div class="goldDisplay">
            🪙 <span id="homeGold">0</span>
        </div>

        <button id="playBtn" class="mainBtn">
            🎮 CHƠI
        </button>

        <button id="shopBtn" class="mainBtn shopButton">
            🏪 CỬA HÀNG
        </button>

    </div>

</div>


<!-- =========================
     CỬA HÀNG
========================= -->
<div id="shopScreen">

    <div class="shopBox">

        <h1>🏪 CỬA HÀNG</h1>

        <div class="shopGold">
            🪙 Vàng:
            <span id="shopGold">0</span>
        </div>

        <div class="shopItem">

            <div>
                <h2>⚔️ Tăng sát thương</h2>

                <p>
                    Sát thương hiện tại:
                    <b id="damageValue">10</b>
                </p>

                <p>
                    Cấp:
                    <b id="damageLevel">0</b>
                </p>
            </div>

            <button id="buyDamage">
                Mua <span id="damagePrice">100</span> 🪙
            </button>

        </div>


        <div class="shopItem">

            <div>
                <h2>❤️ Tăng máu</h2>

                <p>
                    Máu tối đa:
                    <b id="hpValue">100</b>
                </p>

                <p>
                    Cấp:
                    <b id="hpLevel">0</b>
                </p>
            </div>

            <button id="buyHP">
                Mua <span id="hpPrice">100</span> 🪙
            </button>

        </div>


        <button id="backHomeBtn" class="backBtn">
            ← Quay lại
        </button>

    </div>

</div>


<!-- =========================
     GAME
========================= -->
<div id="gameScreen">

    <canvas id="gameCanvas"></canvas>


    <!-- =========================
         MOBILE CONTROL
    ========================== -->
    <div id="mobileControls">

        <div id="joystick">

            <button
                class="joy-btn up"
                data-key="w">
                ▲
            </button>

            <button
                class="joy-btn left"
                data-key="a">
                ◀
            </button>

            <button
                class="joy-btn right"
                data-key="d">
                ▶
            </button>

            <button
                class="joy-btn down"
                data-key="s">
                ▼
            </button>

            <div class="joy-center"></div>

        </div>


        <button id="attackBtn">
            ⚔️
        </button>

    </div>


    <button id="gameMenuBtn">
        ☰
    </button>

</div>


<script src="game.js"></script>

</body>
</html>
